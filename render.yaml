services:
  - type: web
    name: archishield-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: N8N_ENABLED
        value: "true"
      - key: N8N_WEBHOOK_URL
        value: "https://architechs.app.n8n.cloud/webhook/archishield-analysis"
      - key: N8N_WEBHOOK_SECRET
        value: "archishield-n8n-secret-2026"
      - key: NBC_COMPLIANCE_THRESHOLD
        value: "80"
